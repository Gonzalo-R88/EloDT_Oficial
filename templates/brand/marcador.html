<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="base.css">
  <style>
    /* Marca ELO DT.
       Perfil: "ELO" sobre "DT", sin adornos. X lo recorta en círculo y lo muestra a ~40 px,
       así que sólo texto grande y centrado: cualquier detalle de las esquinas se pierde.
       Banner: no repite el logo (ya está en el avatar); dice qué hace la cuenta y lleva un
       podio abstracto. Todo el contenido vive entre 60 px del borde superior e inferior,
       porque X recorta distinto en cada dispositivo, y arranca lejos de la esquina inferior
       izquierda, que la tapa el avatar. */
    body {
      /* Degradado parejo: una sola dirección + un brillo suave, sin franjas oscuras. */
      background:
        radial-gradient(circle at 72% 78%, rgba(34, 184, 240, 0.22), transparent 62%),
        linear-gradient(158deg, #2a2060 0%, #3b1a7a 52%, #4c1d95 100%);
      color: var(--blanco);
    }
    .marca { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

    {% if formato == 'perfil' %}
    .marca { display: flex; align-items: center; justify-content: center; }
    .lockup {
      display: flex; flex-direction: column; align-items: center;
      font-family: "Anton", "DejaVu Sans", sans-serif;
      text-transform: uppercase; line-height: 1;
      font-size: 38vh;        /* "ELO" ocupa ~56% del ancho; apilado da letras más grandes que en una línea */
      text-align: center;
    }
    .lockup .dt { color: var(--celeste); display: block; }

    {% else %}
    .marca {
      /* El grupo (texto + podio) va centrado: llena el medio y deja libre la franja
         izquierda, que es donde X apoya el avatar. */
      display: flex; align-items: center; justify-content: center; gap: 7vh;
    }
    .texto { display: flex; flex-direction: column; gap: 2.2vh; }
    .titular {
      font-weight: 700; font-size: 8.4vh; line-height: 1.06;
      letter-spacing: -0.01em; color: var(--blanco);
    }
    .titular em { font-style: normal; color: var(--celeste); }
    .bajada {
      font-weight: 600; font-size: 4.4vh; letter-spacing: 0.04em;
      color: var(--lila);
    }

    /* Podio abstracto: tres barras con siluetas y el puesto. Sin nombres, no se desactualiza. */
    .podio { display: flex; align-items: flex-end; gap: 1.4vh; }
    .puesto { display: flex; flex-direction: column; align-items: center; }
    .silueta { position: relative; width: 7.4vh; height: 8.2vh; margin-bottom: 0.8vh; }
    .silueta::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 3.6vh; height: 3.6vh; border-radius: 50%; background: rgba(255, 255, 255, 0.9);
    }
    .silueta::after {
      content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 7.4vh; height: 4.2vh; border-radius: 4vh 4vh 0 0; background: rgba(255, 255, 255, 0.9);
    }
    .barra {
      width: 11vh; border-radius: 1.2vh 1.2vh 0 0;
      display: flex; justify-content: center; padding-top: 1.2vh;
      font-family: "Anton", "DejaVu Sans", sans-serif;
      font-size: 4.6vh; color: rgba(255, 255, 255, 0.92);
    }
    .primero .barra { height: 21vh; background: linear-gradient(180deg, #22b8f0, #0b93c9); }
    .segundo .barra { height: 15.4vh; background: linear-gradient(180deg, #c4b5fd, #8b5cf6); }
    .tercero .barra { height: 11.2vh; background: linear-gradient(180deg, #8b5cf6, #6d28d9); }
    .segundo .silueta::before, .segundo .silueta::after,
    .tercero .silueta::before, .tercero .silueta::after { background: rgba(255, 255, 255, 0.78); }
    {% endif %}
  </style>
</head>
<body>
  <div class="marca">
    {% if formato == 'perfil' %}
      <div class="lockup">ELO <span class="dt">DT</span></div>
    {% else %}
      <div class="texto">
        <div class="titular">Ranking <em>ELO</em> semanal<br>de entrenadores</div>
        <div class="bajada">Nuevo ranking cada lunes</div>
      </div>
      <div class="podio">
        <div class="puesto segundo"><div class="silueta"></div><div class="barra">2</div></div>
        <div class="puesto primero"><div class="silueta"></div><div class="barra">1</div></div>
        <div class="puesto tercero"><div class="silueta"></div><div class="barra">3</div></div>
      </div>
    {% endif %}
  </div>
</body>
</html>
