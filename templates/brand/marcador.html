<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="base.css">
  <style>
    /* Propuesta 3: marcador de pizarra. Lockup apilado (ELO sobre DT) + diagrama táctico.
       Perfil: diagramas en dos esquinas opuestas (el recorte circular los recorta sin
       romper nada). Banner: texto a la izquierda del centro y diagrama a la derecha, lejos
       del avatar (que se come la esquina inferior izquierda). */
    body {
      background:
        radial-gradient(circle at 80% 15%, rgba(34, 184, 240, 0.22), transparent 55%),
        linear-gradient(158deg, #1b1440 0%, #2e1a63 60%, #3b1a7a 100%);
      color: var(--blanco);
    }
    .marca { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

    .pizarra { position: absolute; }
    .marcador {
      font-family: "Anton", "DejaVu Sans", sans-serif;
      text-transform: uppercase; line-height: 0.98;
      letter-spacing: 0.01em;
    }
    .marcador .dt { color: var(--celeste); display: block; }
    .barra {
      border-radius: 2vh;
      background: linear-gradient(90deg, var(--celeste) 0%, var(--violeta) 60%, rgba(196, 181, 253, 0.35) 100%);
    }
    .tagline {
      font-weight: 600; letter-spacing: 0.36em;
      text-transform: uppercase; color: var(--lila); white-space: nowrap;
    }
    .mano {
      font-size: 2.9vh; font-weight: 600; color: rgba(255, 255, 255, 0.88);
    }

    {% if formato == 'perfil' %}
    .contenido {
      position: relative; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3vh;
    }
    .marcador { font-size: 20vh; text-align: center; }
    .barra { width: 30vw; height: 1vh; }
    .pizarra { width: 36vh; height: 36vh; }
    .arriba { top: -7vh; left: -6vh; }
    .abajo { bottom: -7vh; right: -6vh; transform: rotate(180deg); }
    {% else %}
    .contenido {
      position: absolute; left: 13vw; top: 0; height: 100%;
      display: flex; flex-direction: column; justify-content: center;
      gap: 2vh; align-items: flex-start;
      /* Corrido hacia arriba: el avatar de X se come la esquina inferior izquierda. */
      padding-bottom: 7vh;
    }
    .marcador { font-size: 12.5vh; }
    .barra { width: 6vw; height: 0.55vh; background: var(--celeste); }
    .tagline { font-size: 2.4vh; letter-spacing: 0.2em; }
    .mano { margin-top: 0.6vh; }
    /* Un solo diagrama, a la derecha y centrado: el avatar no llega ahí. */
    .pizarra { width: 34vh; height: 34vh; right: 8vw; top: 50%; transform: translateY(-50%); }
    {% endif %}
  </style>
</head>
<body>
  <div class="marca">
    {% if formato == 'perfil' %}
      {% for posicion in ['arriba', 'abajo'] %}
      <svg class="pizarra {{ posicion }}" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round"
           stroke-opacity="0.5" stroke-dasharray="7 8">
          <circle cx="20" cy="28" r="9" fill="#c4b5fd" fill-opacity="0.10" stroke="none"/>
          <circle cx="72" cy="16" r="6" fill="#c4b5fd" fill-opacity="0.08" stroke="none"/>
          <path d="M26 32 C 42 42, 50 46, 58 52"/>
          <path d="M56 52 l -7 -1 M58 52 l -1 -7" stroke-dasharray="none"/>
        </g>
      </svg>
      {% endfor %}
    {% else %}
      <svg class="pizarra" viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke="#c4b5fd" stroke-width="1.4" stroke-linecap="round"
           stroke-opacity="0.55" stroke-dasharray="6 7">
          <circle cx="22" cy="76" r="10" fill="#c4b5fd" fill-opacity="0.10" stroke="none"/>
          <circle cx="78" cy="24" r="10" fill="#c4b5fd" fill-opacity="0.10" stroke="none"/>
          <circle cx="50" cy="50" r="26" stroke-opacity="0.18" stroke-dasharray="none"/>
          <path d="M30 70 C 42 60, 58 48, 70 34"/>
          <path d="M68 34 l -8 0 M70 32 l 0 8" stroke-dasharray="none"/>
        </g>
      </svg>
    {% endif %}

    <div class="contenido">
      <div class="marcador">ELO <span class="dt">DT</span></div>
      <div class="barra"></div>
      {% if formato != 'perfil' %}
        <div class="tagline">Analítica de entrenadores</div>
        <div class="mano">{{ handle }}</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
