<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="base.css">
  <style>
    /* Propuesta 1: wordmark. Sólo tipografía, sin íconos.
       Perfil: "ELO DT" en una línea (se lee a 48 px).
       Banner: misma marca centrada — en móvil X recorta el banner al centro y el avatar
       tapa la esquina inferior izquierda, así que nada importante vive ahí. */
    body {
      background:
        radial-gradient(circle at 78% 88%, rgba(34, 184, 240, 0.30), transparent 58%),
        radial-gradient(circle at 12% 8%, rgba(139, 92, 246, 0.45), transparent 55%),
        linear-gradient(158deg, #241c4a 0%, #3b1a7a 55%, #4c1d95 100%);
      color: var(--blanco);
    }
    .marca {
      width: 100vw; height: 100vh; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .lockup { display: flex; flex-direction: column; align-items: center; }
    .wordmark {
      font-family: "Anton", "DejaVu Sans", sans-serif;
      text-transform: uppercase; line-height: 0.92;
      letter-spacing: 0.01em; white-space: nowrap;
    }
    .wordmark .dt { color: var(--celeste); }
    .barra {
      border-radius: 2vh; background: var(--lila);
    }
    .tagline {
      font-weight: 600; letter-spacing: 0.36em;
      text-transform: uppercase; color: var(--lila);
      white-space: nowrap;
    }
    .mano {
      position: absolute; right: 4vw; bottom: 6vh;
      font-size: 3vh; font-weight: 600; color: rgba(255, 255, 255, 0.9);
    }

    {% if formato == 'perfil' %}
    .lockup { gap: 4vh; }
    .wordmark { font-size: 26vh; }
    .barra { width: 25vw; height: 0.9vh; }
    {% else %}
    .lockup { gap: 2.6vh; }
    .wordmark { font-size: 20vh; }
    .barra { width: 7vw; height: 0.55vh; background: var(--celeste); }
    .tagline { font-size: 2.8vh; }
    {% endif %}
  </style>
</head>
<body>
  <div class="marca">
    <div class="lockup">
      <div class="wordmark">ELO <span class="dt">DT</span></div>
      <div class="barra"></div>
      {% if formato != 'perfil' %}<div class="tagline">Analítica de entrenadores</div>{% endif %}
    </div>
    {% if formato != 'perfil' %}<div class="mano">{{ handle }}</div>{% endif %}
  </div>
</body>
</html>
