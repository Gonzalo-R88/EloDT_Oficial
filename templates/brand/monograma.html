<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="base.css">
  <style>
    /* Propuesta 2: monograma "ED". Iniciales grandes para el perfil (X recorta en círculo
       y el texto largo desaparece) y el nombre completo en el banner. */
    body {
      background:
        radial-gradient(circle at 50% 120%, rgba(34, 184, 240, 0.28), transparent 60%),
        linear-gradient(158deg, #241c4a 0%, #3b1a7a 60%, #4c1d95 100%);
      color: var(--blanco);
    }
    .marca {
      width: 100vw; height: 100vh; position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .sello {
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: linear-gradient(150deg, #8b5cf6, #6d28d9 62%, #4c1d95);
      box-shadow:
        inset 0 0 0 0.7vh rgba(255, 255, 255, 0.12),
        0 0 0 0.35vh rgba(196, 181, 253, 0.35);
      font-family: "Anton", "DejaVu Sans", sans-serif;
      text-transform: uppercase; line-height: 1;
      gap: 0.16em;
    }
    .sello .e { color: var(--celeste-claro); }
    .sello .d { color: var(--blanco); }

    .texto { display: flex; flex-direction: column; }
    .nombre {
      font-family: "Anton", "DejaVu Sans", sans-serif;
      text-transform: uppercase; line-height: 0.95; letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .nombre .dt { color: var(--celeste); }
    .tagline {
      font-weight: 600; letter-spacing: 0.36em;
      text-transform: uppercase; color: var(--lila); white-space: nowrap;
    }
    .mano {
      position: absolute; right: 4vw; bottom: 6vh;
      font-size: 2.9vh; font-weight: 600; color: rgba(255, 255, 255, 0.9);
    }

    {% if formato == 'perfil' %}
    /* 64vh de diámetro deja aire suficiente dentro del recorte circular de X. */
    .sello { width: 64vh; height: 64vh; font-size: 30vh; }
    {% else %}
    .marca { gap: 3.2vw; }
    .sello { width: 26vh; height: 26vh; font-size: 13vh; }
    .texto { gap: 1.4vh; }
    .nombre { font-size: 10vh; }
    .tagline { font-size: 2.6vh; }
    {% endif %}
  </style>
</head>
<body>
  <div class="marca">
    <div class="sello"><span class="e">E</span><span class="d">D</span></div>
    {% if formato != 'perfil' %}
      <div class="texto">
        <div class="nombre">ELO <span class="dt">DT</span></div>
        <div class="tagline">Analítica de entrenadores</div>
      </div>
      <div class="mano">{{ handle }}</div>
    {% endif %}
  </div>
</body>
</html>
